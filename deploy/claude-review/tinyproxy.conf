# tinyproxy für den Claude-Prüfagenten (Etappe q): nur 127.0.0.1, nur HTTPS-CONNECT zu Anthropic.
# Installiert nach /etc/tinyproxy/tinyproxy.conf (Original: tinyproxy.conf.orig). Filter: claude-allow.filter
User tinyproxy
Group tinyproxy
Port 8888
Listen 127.0.0.1
Timeout 600
MaxClients 10
DefaultErrorFile "/usr/share/tinyproxy/default.html"
StatFile "/usr/share/tinyproxy/stats.html"
LogFile "/var/log/tinyproxy/tinyproxy.log"
LogLevel Connect
PidFile "/run/tinyproxy/tinyproxy.pid"
DisableViaHeader Yes
Allow 127.0.0.1
# Nur HTTPS: CONNECT ausschließlich auf Port 443
ConnectPort 443
# Allowlist: alles, was nicht im Filter steht, wird abgelehnt (403)
Filter "/etc/tinyproxy/claude-allow.filter"
FilterType ere
FilterDefaultDeny Yes
FilterURLs No
FilterCaseSensitive No
