#!/usr/sbin/nft -f
# Netz-Abschottung des Prüfagenten (Etappe q): eigene Tabelle, berührt andere Regeln nicht.
#   - Der Benutzer claude-review darf ausgehend NUR über Loopback zum lokalen Proxy (tcp/8888).
#     Alles andere (LAN, Internet, SSH, DNS, andere Loopback-Ports) wird verworfen.
#   - Den Proxy (tcp/8888 auf Loopback) darf nur claude-review benutzen.
# Der Proxy selbst läuft als Benutzer tinyproxy und erreicht per Filter nur Anthropic-Hosts (Port 443).
# Aktivieren: deploy/claude-review/install.sh --apply-firewall (Syntaxcheck, Rollback nach 60 s ohne
# Bestätigung). Voraussetzung: der Benutzer claude-review existiert (nft löst den Namen beim Laden auf).
# LXC: nft im Container braucht die passende CT-Konfiguration (nesting/Netfilter); `meta skuid` gilt für
# die UIDs im Container. Diese Schicht ergänzt die systemd-Sperre IPAddressDeny=any, sie ersetzt sie nicht.

add table inet claude_review_fw
flush table inet claude_review_fw

table inet claude_review_fw {
    chain output {
        type filter hook output priority filter; policy accept;

        meta skuid "claude-review" oifname "lo" tcp dport 8888 accept comment "nur lokaler Proxy"
        meta skuid "claude-review" counter drop comment "alles andere aus dem Prüfagenten"
        oifname "lo" tcp dport 8888 counter drop comment "Proxy nur für claude-review"
    }
}
