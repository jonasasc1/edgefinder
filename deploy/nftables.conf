#!/usr/sbin/nft -f
# Firewall für „trading“ (10.10.20.65): nur eingehend, Default drop.
#   - 8420/tcp (edgefinder) nur von cloudflared auf CT 105 (10.10.20.20)
#   - 22/tcp (SSH) nur von der Agent-VM (10.10.20.90)
#   - Loopback, bestehende Verbindungen und ICMP sind erlaubt
# Ausgehender Verkehr und Forwarding bleiben unberührt (Datenquellen, apt, GitHub).
# Eigene Tabelle: andere nftables-Regeln werden nicht angefasst.
# Aktivieren: deploy/install.sh --apply-firewall (Syntaxcheck, Auto-Rollback nach 60 s ohne Bestätigung).
# Die Proxmox-Firewall auf CT-Ebene gilt unabhängig davon zusätzlich.
# Port 8420 muss mit server.port in config.yaml übereinstimmen (prüft install.sh).

add table inet edgefinder_fw
flush table inet edgefinder_fw

table inet edgefinder_fw {
    chain input {
        type filter hook input priority filter; policy drop;

        ct state invalid drop
        ct state established,related accept
        iifname "lo" accept

        # Ping und IPv6-Nachbarsuche (ohne ICMPv6 fällt IPv6 aus)
        ip protocol icmp accept
        ip6 nexthdr icmpv6 accept

        ip saddr 10.10.20.90 tcp dport 22 accept comment "SSH von der Agent-VM"
        ip saddr 10.10.20.20 tcp dport 8420 accept comment "edgefinder von cloudflared (CT 105)"
    }
}
