[project]
name = "edgefinder"
version = "0.1.0"
description = "Makro-, Sentiment- und Fundamental-Dashboard"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "uvicorn>=0.32",
]

[project.scripts]
edgefinder = "edgefinder.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/edgefinder"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["backend"]
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PTH", "RUF", "S"]
ignore = ["RUF001", "RUF002", "RUF003"]  # deutsche Texte: typografische Zeichen erlaubt

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S101"]
