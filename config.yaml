# edgefinder – zentrale Konfiguration
# Assets, Datenquellen, Zeitpläne, Profile und Gewichtungen. Secrets stehen in .env.
# Prüfen mit: uv run edgefinder check-config

server:
  host: 0.0.0.0        # Zugriff wird per Firewall auf cloudflared (10.10.20.20) begrenzt
  port: 8420

storage:
  database: data/edgefinder.db
  raw_dir: data/raw      # Rohantworten der Quellen (je Quelle/Datum)

# ---------------------------------------------------------------------------
# Datenquellen
# schedule: systemd-OnCalendar-Ausdruck (daraus werden die Timer erzeugt)
# stale_after_hours: ab wann der Datenstatus „veraltet“ meldet
# ---------------------------------------------------------------------------
sources:
  cftc:
    schedule: "Fri *-*-* 22:15:00 Europe/Vienna"   # Release freitags 15:30 ET
    stale_after_hours: 192
    min_interval_seconds: 1
    options:
      base_url: https://publicreporting.cftc.gov/resource
      dataset: 6dca-aqww          # „Legacy - Futures Only“ (live geprüft 2026-11-17)
      history_years: 6
  fred:
    schedule: "*-*-* 06:30:00 Europe/Vienna"
    stale_after_hours: 48
    min_interval_seconds: 0.6     # Limit: 120 Requests/Minute
    options:
      base_url: https://api.stlouisfed.org/fred
      history_years: 15
      vintages: true              # ALFRED: alle Vorabstände je Beobachtung (Backtest ohne Vorgriff)
  eurostat:
    schedule: "*-*-* 06:45:00 Europe/Vienna"
    stale_after_hours: 48
    min_interval_seconds: 1
    options:
      base_url: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data
      history_years: 15
  ecb:
    schedule: "*-*-* 06:50:00 Europe/Vienna"
    stale_after_hours: 48
    min_interval_seconds: 1
    options:
      base_url: https://data-api.ecb.europa.eu/service/data
      history_years: 15
  prices:
    schedule: "*-*-* 07:00,23:15:00 Europe/Vienna"
    stale_after_hours: 36
    min_interval_seconds: 1.5
    options:
      history_years: 15
  myfxbook:
    schedule: "*-*-* 00/4:20:00 Europe/Vienna"     # 6 Läufe/Tag, je 1–2 Requests
    stale_after_hours: 12
    min_interval_seconds: 5
    daily_request_limit: 80       # Gratis-Limit 100/24 h, Reserve für Re-Login
    options:
      base_url: https://www.myfxbook.com/api
      session_max_age_days: 25    # Session läuft nach ca. 1 Monat ab → vorher neu anmelden
      login_retry_hours: 12       # nach fehlgeschlagenem Login so lange kein neuer Versuch
  aaii:
    schedule: "Thu,Fri *-*-* 08:00:00 Europe/Vienna"   # neue Werte donnerstags
    stale_after_hours: 216
    min_interval_seconds: 10
    options:
      url: https://www.aaii.com/sentimentsurvey
      # Ehrlicher UA mit Zweck; der kurze Standard-UA „edgefinder/0.1“ bekam HTTP 403 (2026-11-17)
      user_agent: "edgefinder/0.1 (private, non-commercial research project; one request per day)"
  edgar:
    schedule: "*-*-* 05:30:00 Europe/Vienna"
    stale_after_hours: 48
    min_interval_seconds: 0.2     # SEC erlaubt max. 10 Requests/Sekunde
    options:
      base_url: https://data.sec.gov
      insider_lookback_days: 365
      cik_refresh_days: 7          # company_tickers.json neu laden
      fundamentals_refresh_days: 3 # companyfacts sind mehrere MB je Ticker
      fundamentals_history_years: 10   # nach Einreichungsdatum
      fundamentals_forms: ["10-K", "10-Q"]
      fundamentals_concepts:       # "Taxonomie:Konzept"; fehlende Konzepte je Firma sind normal
        - us-gaap:Revenues
        - us-gaap:RevenueFromContractWithCustomerExcludingAssessedTax
        - us-gaap:GrossProfit
        - us-gaap:OperatingIncomeLoss
        - us-gaap:NetIncomeLoss
        - us-gaap:EarningsPerShareDiluted
        - us-gaap:Assets
        - us-gaap:Liabilities
        - us-gaap:StockholdersEquity
        - us-gaap:CashAndCashEquivalentsAtCarryingValue
        - us-gaap:LongTermDebt
        - us-gaap:NetCashProvidedByUsedInOperatingActivities
        - us-gaap:PaymentsToAcquirePropertyPlantAndEquipment
        - us-gaap:WeightedAverageNumberOfDilutedSharesOutstanding
        - dei:EntityCommonStockSharesOutstanding
  finra:
    schedule: "Mon,Thu *-*-* 05:45:00 Europe/Vienna"   # Veröffentlichung zweiwöchentlich
    stale_after_hours: 504
    min_interval_seconds: 1
    options:
      history_years: 2             # Erstladung; danach nur die letzten 60 Tage (Revisionen)

# Standard für alle Quellen (je Quelle unter `retry:` überschreibbar)
retry:
  attempts: 4
  backoff_seconds: 2
  max_backoff_seconds: 60
  timeout_seconds: 30

# ---------------------------------------------------------------------------
# Volkswirtschaften und ihre Makro-Indikatoren
# category: growth | inflation | labor | rates
# transform: level | yoy (Veränderung zum Vorjahr in %) | diff (absolute Veränderung)
# higher_is: bullish | bearish – Wirkung eines höheren Werts auf die Währung
# series: FRED-Serien-ID · ECB: "Dataflow/Schlüssel" · Eurostat: "Datensatz?Filter" (ein Filter je
# Dimension, sodass genau eine Zeitreihe übrig bleibt). Alle Serien sind am 2026-11-17 live
# geprüft (Daten bis mindestens Aug./Sep. 2026). Nicht aufgeführt = keine aktuelle Gratis-Serie
# in FRED/Eurostat/ECB (siehe CLAUDE.md, Abschnitt „Offen“). Wo es keine aktuelle Reihe des
# offiziellen Leitzinses gibt, steht ein Tagesgeld-/Interbankzins als Proxy (im Label vermerkt).
# transform bei Wachstumsraten: Die Quelle liefert bereits die Veränderung zum Vorjahr in %,
# daher `level` (z. B. FRED-Serien auf *GYSAM, Eurostat RCH_A / CLV_PCH_SM).
# ---------------------------------------------------------------------------
economies:
  US:
    name: USA
    indicators:
      gdp:           {label: "BIP (real)",              source: fred, series: GDPC1,    category: growth,    transform: yoy,   higher_is: bullish}
      industrial:    {label: "Industrieproduktion",     source: fred, series: INDPRO,   category: growth,    transform: yoy,   higher_is: bullish}
      retail_sales:  {label: "Einzelhandelsumsätze",    source: fred, series: RSAFS,    category: growth,    transform: yoy,   higher_is: bullish}
      cpi:           {label: "Inflation (CPI)",         source: fred, series: CPIAUCSL, category: inflation, transform: yoy,   higher_is: bullish}
      core_cpi:      {label: "Kerninflation (CPI)",     source: fred, series: CPILFESL, category: inflation, transform: yoy,   higher_is: bullish}
      unemployment:  {label: "Arbeitslosenquote",       source: fred, series: UNRATE,   category: labor,     transform: level, higher_is: bearish}
      payrolls:      {label: "Beschäftigung (NFP)",     source: fred, series: PAYEMS,   category: labor,     transform: diff,  higher_is: bullish}
      jobless:       {label: "Erstanträge Arbeitslosenhilfe", source: fred, series: ICSA, category: labor,   transform: level, higher_is: bearish}
      policy_rate:   {label: "Leitzins (Fed Funds)",    source: fred, series: FEDFUNDS, category: rates,     transform: level, higher_is: bullish}
      yield_2y:      {label: "Rendite 2 Jahre",         source: fred, series: DGS2,     category: rates,     transform: level, higher_is: bullish}
      yield_10y:     {label: "Rendite 10 Jahre",        source: fred, series: DGS10,    category: rates,     transform: level, higher_is: bullish}
  EZ:
    name: Euroraum
    indicators:
      gdp:           {label: "BIP (real, Vorjahr in %)", source: eurostat, series: "namq_10_gdp?s_adj=SCA&unit=CLV_PCH_SM&na_item=B1GQ&geo=EA21", category: growth, transform: level, higher_is: bullish}
      industrial:    {label: "Industrieproduktion", source: eurostat, series: "sts_inpr_m?indic_bt=PRD&nace_r2=B-D&s_adj=SCA&unit=I21&geo=EA21", category: growth, transform: yoy, higher_is: bullish}
      retail_sales:  {label: "Einzelhandelsumsätze (Volumen)", source: eurostat, series: "sts_trtu_m?indic_bt=VOL_SLS&nace_r2=G47&s_adj=SCA&unit=I21&geo=EA21", category: growth, transform: yoy, higher_is: bullish}
      cpi:           {label: "Inflation (HICP, Vorjahr in %)", source: eurostat, series: "prc_hicp_minr?coicop18=TOTAL&unit=RCH_A&geo=EA", category: inflation, transform: level, higher_is: bullish}
      core_cpi:      {label: "Kerninflation (HICP, Vorjahr in %)", source: eurostat, series: "prc_hicp_minr?coicop18=TOT_X_NRG_FOOD&unit=RCH_A&geo=EA", category: inflation, transform: level, higher_is: bullish}
      unemployment:  {label: "Arbeitslosenquote", source: eurostat, series: "une_rt_m?s_adj=SA&age=TOTAL&unit=PC_ACT&sex=T&geo=EA21", category: labor, transform: level, higher_is: bearish}
      policy_rate:   {label: "Leitzins (EZB Einlagesatz)", source: ecb, series: FM/D.U2.EUR.4F.KR.DFR.LEV, category: rates, transform: level, higher_is: bullish}
      yield_2y:      {label: "Rendite 2 Jahre (Euro-Staatsanleihen, AAA)", source: ecb, series: YC/B.U2.EUR.4F.G_N_A.SV_C_YM.SR_2Y, category: rates, transform: level, higher_is: bullish}
      yield_10y:     {label: "Rendite 10 Jahre (Euro-Staatsanleihen, AAA)", source: ecb, series: YC/B.U2.EUR.4F.G_N_A.SV_C_YM.SR_10Y, category: rates, transform: level, higher_is: bullish}
  DE:
    name: Deutschland
    indicators:
      gdp:           {label: "BIP (real, Vorjahr in %)", source: eurostat, series: "namq_10_gdp?s_adj=SCA&unit=CLV_PCH_SM&na_item=B1GQ&geo=DE", category: growth, transform: level, higher_is: bullish}
      industrial:    {label: "Industrieproduktion", source: eurostat, series: "sts_inpr_m?indic_bt=PRD&nace_r2=B-D&s_adj=SCA&unit=I21&geo=DE", category: growth, transform: yoy, higher_is: bullish}
      retail_sales:  {label: "Einzelhandelsumsätze (Volumen)", source: eurostat, series: "sts_trtu_m?indic_bt=VOL_SLS&nace_r2=G47&s_adj=SCA&unit=I21&geo=DE", category: growth, transform: yoy, higher_is: bullish}
      cpi:           {label: "Inflation (HICP, Vorjahr in %)", source: eurostat, series: "prc_hicp_minr?coicop18=TOTAL&unit=RCH_A&geo=DE", category: inflation, transform: level, higher_is: bullish}
      core_cpi:      {label: "Kerninflation (HICP, Vorjahr in %)", source: eurostat, series: "prc_hicp_minr?coicop18=TOT_X_NRG_FOOD&unit=RCH_A&geo=DE", category: inflation, transform: level, higher_is: bullish}
      unemployment:  {label: "Arbeitslosenquote", source: eurostat, series: "une_rt_m?s_adj=SA&age=TOTAL&unit=PC_ACT&sex=T&geo=DE", category: labor, transform: level, higher_is: bearish}
      yield_10y:     {label: "Rendite 10 Jahre (Bund, Monatswert)", source: fred, series: IRLTLT01DEM156N, category: rates, transform: level, higher_is: bullish}
  UK:
    name: Großbritannien
    indicators:
      gdp:           {label: "BIP (real)", source: fred, series: NGDPRSAXDCGBQ, category: growth, transform: yoy, higher_is: bullish}
      industrial:    {label: "Industrieproduktion (Vorjahr in %)", source: fred, series: GBRPRINTO01GYSAM, category: growth, transform: level, higher_is: bullish}
      retail_sales:  {label: "Einzelhandelsumsätze (Volumen, Vorjahr in %)", source: fred, series: GBRSLRTTO01GYSAM, category: growth, transform: level, higher_is: bullish}
      unemployment:  {label: "Arbeitslosenquote", source: fred, series: LRHUTTTTGBM156S, category: labor, transform: level, higher_is: bearish}
      policy_rate:   {label: "Leitzins-Proxy (SONIA, Tagesgeld)", source: fred, series: IUDSOIA, category: rates, transform: level, higher_is: bullish}
      yield_10y:     {label: "Rendite 10 Jahre (Monatswert)", source: fred, series: IRLTLT01GBM156N, category: rates, transform: level, higher_is: bullish}
  JP:
    name: Japan
    indicators:
