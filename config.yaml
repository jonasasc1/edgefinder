# ---------------------------------------------------------------------------
# Score-Engine
# Teilscores liegen auf [-1, +1]; gewichtete Summe × 10 ergibt den Gesamtscore.
# Gewichte je Assetklasse müssen sich zu 1 summieren.
# ---------------------------------------------------------------------------
scoring:
  schedule: ["*-*-* 07:30:00 Europe/Vienna", "*-*-* 23:45:00 Europe/Vienna"]
  # Version des Modells (Gewichte, Faktoren, Labels, Faktor-Parameter). Bei jeder solchen Änderung erhöhen:
  # Scores/Live-Auswertungen tragen sie mit, `edgefinder maintain` rechnet den Backfill dann komplett neu.
  model_version: "2026-11-21"
  labels:            # absteigend; erstes Label, dessen `min` erreicht wird
    - {min: 6.0,   label: "Stark bullish"}
    - {min: 2.0,   label: "Bullish"}
    - {min: -2.0,  label: "Neutral"}
    - {min: -6.0,  label: "Bearish"}
    - {min: -10.0, label: "Stark bearish"}
  signal_threshold: 0.15     # Scorecard: ab |Teilscore| (−1…+1) Pille bullish/bearish, sonst neutral
  earnings_neutral_pct: 1.0  # Scorecard: Gewinnüberraschung innerhalb ±1 % = neutral

profiles:
  swing:
    label: Swing
    horizon: "Tage bis Wochen"
    params:
      cot:              {percentile_weeks: 156, change_weeks: 4}
      retail_sentiment: {smoothing_days: 3}
      macro:            {change_months: 3, history_years: 10, max_age_days: 270, rates_max_age_days: 120}
      trend:            {sma_days: [20, 50], roc_days: 20, reversal_classes: [index, stock]}
      seasonality:      {years: 10, forward_days: 21}
      aaii:             {smoothing_weeks: 1, history_weeks: 156, min_weeks: 26, fallback_mean: 6.5, fallback_std: 16.0}
      fundamentals:     {growth_quarters: 4, valuation_years: 5}
      earnings:         {quarters: 2}
      short_interest:   {change_periods: 2}
      insider:          {lookback_days: 90}
    weights:
      forex:     {cot: 0.25, retail_sentiment: 0.20, macro: 0.15, trend: 0.30, seasonality: 0.10}
      index:     {cot: 0.20, retail_sentiment: 0.05, macro: 0.15, trend: 0.35, seasonality: 0.10, aaii: 0.15}
      commodity: {cot: 0.30, retail_sentiment: 0.15, macro: 0.10, trend: 0.35, seasonality: 0.10}
      stock:     {fundamentals: 0.15, earnings: 0.20, trend: 0.30, short_interest: 0.10, insider: 0.10, seasonality: 0.05, aaii: 0.10}

  long_term:
    label: Langfristig
    horizon: "Wochen bis Monate"
    # Hinweise im UI (Übersicht, Detail, Vergleich) für die genannten Assetklassen. Eintrag löschen
    # oder `notices: []` setzen = Hinweis weg (Neustart des Servers nötig, kein Code).
    notices:
      - asset_classes: [index, stock]
        level: info
        text: "Langfrist-Scores für Indizes und Aktien haben im Backtest bisher keinen belegten Vorhersagewert. Sie sind als Einordnung gedacht, nicht als Signal. Der Hinweis entfällt, sobald belastbare Langzeitdaten vorliegen."
    params:
      cot:              {percentile_weeks: 156, change_weeks: 13}
      retail_sentiment: {smoothing_days: 10}
      macro:            {change_months: 12, history_years: 10, max_age_days: 270, rates_max_age_days: 120}
      trend:            {sma_days: [50, 200], roc_days: 126}
      seasonality:      {years: 15, forward_days: 63}
      aaii:             {smoothing_weeks: 8, history_weeks: 260, min_weeks: 26, fallback_mean: 6.5, fallback_std: 16.0}
      fundamentals:     {growth_quarters: 12, valuation_years: 10}
      earnings:         {quarters: 4}
      short_interest:   {change_periods: 6}
      insider:          {lookback_days: 180}
    weights:
      forex:     {cot: 0.25, retail_sentiment: 0.05, macro: 0.40, trend: 0.20, seasonality: 0.10}
      index:     {cot: 0.15, retail_sentiment: 0.05, macro: 0.35, trend: 0.25, seasonality: 0.10, aaii: 0.10}
      commodity: {cot: 0.30, retail_sentiment: 0.05, macro: 0.25, trend: 0.30, seasonality: 0.10}
      stock:     {fundamentals: 0.35, earnings: 0.15, trend: 0.20, short_interest: 0.05, insider: 0.10, seasonality: 0.05, aaii: 0.10}

# ---------------------------------------------------------------------------
# Backtest (Etappe h): `edgefinder score --from … --to …` (Backfill) und `edgefinder backtest`
# ---------------------------------------------------------------------------
backtest:
  score_weekday: 4          # Backfill-Stichtage: 0 = Montag … 4 = Freitag; null = jeder Werktag
  start: 2013-01-01         # frühester Stichtag (Kurse reichen bis 2011, Makro braucht ~2 Jahre Vorlauf)
  output_dir: data/backtest # Report (Markdown) und JSON; nicht im Git
  horizons:                 # Forward-Rendite in Handelstagen je Profil
    swing: [5, 10, 20]
    long_term: [20, 60, 120]
  primary_horizon: {swing: 10, long_term: 60}   # Kennwert in Übersichtstabellen
  min_signals: 30           # weniger Beobachtungen: Wert wird als „zu wenig“ markiert
  calibration_file: docs/calibration.json   # Eichung (`edgefinder calibrate`), im Git, API liefert sie ohne Backfill
  calibration:              # Evidenzstufen je (Profil, Klasse, Score-Bereich) – feste Regeln, siehe CLAUDE.md
    train_end: 2019-12-31   # Training bis hier, Out-of-Sample danach
    min_t: 2.0              # belegt: t des Vorteils gegenüber der Basis (mit n_eff) ≥ 2
    min_n_eff: 30           # belegt: n_eff Gesamt ≥ 30
    min_n_eff_period: 10    # belegt: n_eff in Training UND OOS je ≥ 10
    floor_n_eff: 5          # darunter in einem der drei Zeiträume: „zu wenig Daten“
    asset_min_n_eff: 30     # Kennzahlen je Einzel-Asset erst ab n_eff 30
    confidence_z: 1.96      # Konfidenzband 95 %
    agreement_threshold: 0.7  # „hohe Faktor-Übereinstimmung“ ab 70 % Gewichtsanteil
    agreement_min_t: 2.7      # t für „belegt“ bei Übereinstimmungs-Gruppen (8 Tests, Bonferroni)

# ---------------------------------------------------------------------------
# Wartung (Etappe g): Timer für `edgefinder cleanup` (Sicherung macht Jonas per Proxmox)
# ---------------------------------------------------------------------------
maintenance:
  cleanup_schedule: "Sun *-*-* 03:30:00 Europe/Vienna"
  evaluate_schedule: "*-*-* 00:10:00 Europe/Vienna"   # nach dem Score-Lauf 23:45: Live-Signale auswerten
  evaluate_stale_after_hours: 48
  maintain_schedule: "Sun *-*-* 04:30:00 Europe/Vienna"  # Eichung neu erzeugen (Backfill ergänzen, calibrate, Drift)
  maintain_stale_after_hours: 216

# ---------------------------------------------------------------------------
# Admin-Bereich (Etappe p): Jobs, die Admins in der Weboberfläche anstoßen dürfen (Allowlist).
# Keine Fetcher, kein Rebuild, kein Löschen. Admins vergibt nur die CLI (`edgefinder admin grant`).
# ---------------------------------------------------------------------------
admin:
  jobs: [review, maintain, score, evaluate, claude_review]
  cooldown_minutes: 10        # Abkühlzeit je Job-Typ nach Ende des letzten Laufs
  cooldown_overrides: {review: 2, claude_review: 0}  # claude: eigene Abkühlzeit unter `claude:`
  max_queue: 4                # wartende + laufende Aufträge insgesamt
  log_tail_bytes: 4096        # gespeicherter Logauszug je Auftrag

# ---------------------------------------------------------------------------
# Claude-Prüfagent (Etappe q): headless Claude Code auf „trading“, nur Analyse/Vorschläge.
# Der Job `claude_review` baut ein Eingabepaket und legt eine Anforderung in die Inbox; ein getrennter,
# stark abgeschotteter systemd-Dienst (Benutzer claude-review) führt den Agenten aus. enabled bleibt
# false, bis deploy/claude-review/install.sh gelaufen und der Abo-Login erledigt ist (README).
# Abkühlzeit/Tageslimit (rollierend 24 h) schützen das Abo-Kontingent.
# ---------------------------------------------------------------------------
claude:
  enabled: false
  base_dir: /var/lib/claude-review
  source_dir: /opt/edgefinder  # Quelltext-Schnappschuss (nur versionierte Textdateien)
  cooldown_minutes: 30
  max_runs_per_day: 3
  max_package_mb: 5
  max_turns: 40
  runtime_max_seconds: 1200    # RuntimeMaxSec der Unit
  retention_days: 90           # Läufe älter als das löscht `edgefinder cleanup`
  fetch_runs_days: 30
  journal_hours: 24

# ---------------------------------------------------------------------------
# Live-Bilanz (Etappe o): Forward-Test der heutigen Signale und Drift gegen die Eichung.
# Der Algorithmus misst und meldet; Modelländerungen nur im Modellpflege-Zyklus (CLAUDE.md).
# ---------------------------------------------------------------------------
live:
  min_n_eff: 10        # Drift-Status „zu_frueh“ unterhalb (n_eff = n ÷ Überlappung h/5)
  min_weeks: 8         # … oder weniger Wochen-Stichtage mit Auswertung (Assets derselben Woche sind nicht unabhängig)
  counter_t: 2.0       # „gegenlaeufig“: Live-Vorteil < 0 und t ≤ −2
  chart_min_weeks: 4   # Zeitverlauf erst ab so vielen Wochen
  factor:              # Faktor-Drift (IC live vs. Backtest)
    min_n_eff: 20
    min_weeks: 8
    min_abs_ic: 0.03   # Backtest-IC betragsmäßig kleiner: kein Vergleich (kein Effekt zum Verfehlen)
    counter_t: 1.5
    warn_weeks: 4      # Warnliste ab so vielen Wochen in Folge mit falschem Vorzeichen
  done:                # Kriterien „geeicht“ je Gruppe (Aussage belastbar geprüft, NICHT „profitabel“)
    min_n_eff: 30
    min_months: 6
    min_weeks: 26
    statuses: [im_rahmen, besser]
