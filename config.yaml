# ---------------------------------------------------------------------------
# Scorecard: Kernzeilen der Makro-Tabellen (EdgeFinder-Muster). Reihenfolge = Anzeige. `key` =
# Indikator-Schlüssel der Volkswirtschaft; `members` = Mittel mehrerer Schlüssel (Ersatz-PMI,
# kein ISM). Gruppenlabel = Score der Kategorie `category` (nur Darstellung, Score unverändert).
# Alles andere steht unter „Weitere Indikatoren“.
# ---------------------------------------------------------------------------
scorecard:
  core:
    - key: inflation
      label: Inflation
      category: inflation
      rows:
        - {key: cpi, label: "CPI YoY"}
        - {key: ppi, label: "PPI YoY"}
        - {key: pce, label: "PCE YoY"}
        - {key: yield_2y_sma, label: "2Y Yield (21-Tage-SMA)"}
    - key: jobs
      label: Jobs market
      category: labor
      rows:
        - {key: payrolls, label: "Non-Farm Payroll"}
        - {key: unemployment, label: "Unemployment Rate"}
        - {key: jobless, label: "Weekly Jobless Claims"}
        - {key: adp, label: "ADP Employment Change"}
        - {key: jolts, label: "JOLTS Job Openings"}
    - key: growth
      label: Economic growth
      category: growth
      rows:
        - {key: gdp_qoq, label: "GDP Growth QoQ"}
        - {key: pmi_manufacturing, label: "Manufacturing PMI (Ersatz)", members: [philly_fed, empire_state], substitute: true}
        - {key: pmi_services, label: "Services PMI (Ersatz)", members: [services_philly, services_empire, services_texas], substitute: true}
        - {key: retail_sales_mom, label: "Retail Sales MoM"}
        - {key: consumer_confidence, label: "Consumer Confidence"}

