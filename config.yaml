# ---------------------------------------------------------------------------
# Score-Engine
# Teilscores liegen auf [-1, +1]; gewichtete Summe × 10 ergibt den Gesamtscore.
# Gewichte je Assetklasse müssen sich zu 1 summieren.
# ---------------------------------------------------------------------------
scoring:
  schedule: "*-*-* 07:30,23:45:00 Europe/Vienna"
  labels:            # absteigend; erstes Label, dessen `min` erreicht wird
    - {min: 6.0,   label: "Stark bullish"}
    - {min: 2.0,   label: "Bullish"}
    - {min: -2.0,  label: "Neutral"}
    - {min: -6.0,  label: "Bearish"}
    - {min: -10.0, label: "Stark bearish"}

profiles:
  swing:
    label: Swing
    horizon: "Tage bis Wochen"
    params:
      cot:              {percentile_weeks: 156, change_weeks: 4}
      retail_sentiment: {smoothing_days: 3}
      macro:            {change_months: 3, history_years: 10, max_age_days: 270, rates_max_age_days: 120}
      trend:            {sma_days: [20, 50], roc_days: 20}
      seasonality:      {years: 10, forward_days: 21}
      aaii:             {smoothing_weeks: 1, history_weeks: 156, min_weeks: 26, fallback_mean: 6.5, fallback_std: 16.0}
      fundamentals:     {growth_quarters: 4, valuation_years: 5}
      earnings:         {quarters: 2}
      short_interest:   {change_periods: 2}
      insider:          {lookback_days: 90}
    weights:
      forex:     {cot: 0.25, retail_sentiment: 0.20, macro: 0.15, trend: 0.30, seasonality: 0.10}
      index:     {cot: 0.20, retail_sentiment: 0.05, macro: 0.15, trend: 0.35, seasonality: 0.10, aaii: 0.15}
      commodity: {cot: 0.30, retail_sentiment: 0.15, macro: 0.10, trend: 0.35, seasonality: 0.10}
      stock:     {fundamentals: 0.15, earnings: 0.20, trend: 0.30, short_interest: 0.10, insider: 0.10, seasonality: 0.05, aaii: 0.10}

  long_term:
    label: Langfristig
    horizon: "Wochen bis Monate"
    params:
      cot:              {percentile_weeks: 156, change_weeks: 13}
      retail_sentiment: {smoothing_days: 10}
      macro:            {change_months: 12, history_years: 10, max_age_days: 270, rates_max_age_days: 120}
      trend:            {sma_days: [50, 200], roc_days: 126}
      seasonality:      {years: 15, forward_days: 63}
      aaii:             {smoothing_weeks: 8, history_weeks: 260, min_weeks: 26, fallback_mean: 6.5, fallback_std: 16.0}
      fundamentals:     {growth_quarters: 12, valuation_years: 10}
      earnings:         {quarters: 4}
      short_interest:   {change_periods: 6}
      insider:          {lookback_days: 180}
    weights:
      forex:     {cot: 0.25, retail_sentiment: 0.05, macro: 0.40, trend: 0.20, seasonality: 0.10}
      index:     {cot: 0.15, retail_sentiment: 0.05, macro: 0.35, trend: 0.25, seasonality: 0.10, aaii: 0.10}
      commodity: {cot: 0.30, retail_sentiment: 0.05, macro: 0.25, trend: 0.30, seasonality: 0.10}
      stock:     {fundamentals: 0.35, earnings: 0.15, trend: 0.20, short_interest: 0.05, insider: 0.10, seasonality: 0.05, aaii: 0.10}
