# edgefinder – zentrale Konfiguration
# Assets, Datenquellen, Zeitpläne, Profile und Gewichtungen. Secrets stehen in .env.
# Prüfen mit: uv run edgefinder check-config

server:
  host: 0.0.0.0        # Zugriff wird per Firewall auf cloudflared (10.10.20.20) begrenzt
  port: 8420

# Benutzerkonten: Identität von Cloudflare Access (siehe README „Konten“). Team-Domain und AUD für den
# strikten JWT-Modus stehen nur in der .env (CF_ACCESS_TEAM_DOMAIN, CF_ACCESS_AUD).
auth:
  mode: header         # header | jwt | off; beide .env-Werte gesetzt = automatisch strikter JWT-Modus
  dev_email: null      # nur lokale Entwicklung (kein Header → diese E-Mail); auf trading leer lassen
  public_hosts: []     # nur falls cloudflared den Host-Header umschreibt (Origin-Prüfung)

storage:
  database: data/edgefinder.db
  raw_dir: data/raw      # Rohantworten der Quellen (je Quelle/Datum)
  raw_retention_days: 30 # `edgefinder cleanup` löscht ältere Rohdateien (DB-Zeilen bleiben)

# ---------------------------------------------------------------------------
# Datenquellen
# schedule: systemd-OnCalendar-Ausdruck (daraus werden die Timer erzeugt)
# stale_after_hours: ab wann der Datenstatus „veraltet“ meldet
# ---------------------------------------------------------------------------
sources:
  cftc:
    schedule: "Fri *-*-* 22:15:00 Europe/Vienna"   # Release freitags 15:30 ET
    stale_after_hours: 192
    min_interval_seconds: 1
    options:
      base_url: https://publicreporting.cftc.gov/resource
      dataset: 6dca-aqww          # „Legacy - Futures Only“ (live geprüft 2026-11-17)
      history_years: 15
  fred:
    schedule: "*-*-* 06:30:00 Europe/Vienna"
    stale_after_hours: 48
    min_interval_seconds: 0.6     # Limit: 120 Requests/Minute
    options:
      base_url: https://api.stlouisfed.org/fred
      history_years: 15
      vintages: true              # ALFRED: alle Vorabstände je Beobachtung (Backtest ohne Vorgriff)
  eurostat:
    schedule: "*-*-* 06:45:00 Europe/Vienna"
    stale_after_hours: 48
    min_interval_seconds: 1
    options:
      base_url: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data
      history_years: 15
  ecb:
    schedule: "*-*-* 06:50:00 Europe/Vienna"
    stale_after_hours: 48
    min_interval_seconds: 1
    options:
      base_url: https://data-api.ecb.europa.eu/service/data
      history_years: 15
  prices:
    schedule: ["*-*-* 07:00:00 Europe/Vienna", "*-*-* 23:15:00 Europe/Vienna"]
    stale_after_hours: 36
    min_interval_seconds: 1.5
    options:
      history_years: 15
  myfxbook:
    schedule: "*-*-* 00/4:20:00 Europe/Vienna"     # 6 Läufe/Tag, je 1–2 Requests
    stale_after_hours: 12
    min_interval_seconds: 5
    daily_request_limit: 80       # Gratis-Limit 100/24 h, Reserve für Re-Login
    options:
      base_url: https://www.myfxbook.com/api
      session_max_age_days: 25    # Session läuft nach ca. 1 Monat ab → vorher neu anmelden
      login_retry_hours: 12       # nach fehlgeschlagenem Login so lange kein neuer Versuch
  aaii:
    schedule: "Thu,Fri *-*-* 08:00:00 Europe/Vienna"   # neue Werte donnerstags
    stale_after_hours: 216
    min_interval_seconds: 10
    options:
      url: https://www.aaii.com/sentimentsurvey
      # Ehrlicher UA mit Zweck; der kurze Standard-UA „edgefinder/0.1“ bekam HTTP 403 (2026-11-17)
      user_agent: "edgefinder/0.1 (private, non-commercial research project; one request per day)"
  edgar:
    schedule: "*-*-* 05:30:00 Europe/Vienna"
    stale_after_hours: 48
    min_interval_seconds: 0.2     # SEC erlaubt max. 10 Requests/Sekunde
    options:
      base_url: https://data.sec.gov
      insider_lookback_days: 365
      cik_refresh_days: 7          # company_tickers.json neu laden
      fundamentals_refresh_days: 3 # companyfacts sind mehrere MB je Ticker
      fundamentals_history_years: 10   # nach Einreichungsdatum
      # Vorgänger-CIKs je Ticker (Holding-Umbau/Fusion): zusätzlich companyfacts + Form 4 der alten
      # CIK, gespeichert unter demselben Ticker. Ticker müssen in der Aktien-Watchlist stehen.
      predecessor_ciks:
        XOM: [34088]               # Exxon Mobil Corp (alt); company_tickers.json zeigt die Holding 2115436
      fundamentals_forms: ["10-K", "10-Q"]
      fundamentals_concepts:       # "Taxonomie:Konzept"; fehlende Konzepte je Firma sind normal
        - us-gaap:Revenues
        - us-gaap:RevenueFromContractWithCustomerExcludingAssessedTax
        - us-gaap:GrossProfit
        - us-gaap:OperatingIncomeLoss
        - us-gaap:NetIncomeLoss
        - us-gaap:EarningsPerShareDiluted
        - us-gaap:Assets
        - us-gaap:Liabilities
        - us-gaap:StockholdersEquity
        - us-gaap:CashAndCashEquivalentsAtCarryingValue
        - us-gaap:LongTermDebt
        - us-gaap:NetCashProvidedByUsedInOperatingActivities
        - us-gaap:PaymentsToAcquirePropertyPlantAndEquipment
        - us-gaap:WeightedAverageNumberOfDilutedSharesOutstanding
        - dei:EntityCommonStockSharesOutstanding
  finra:
    schedule: "Mon,Thu *-*-* 05:45:00 Europe/Vienna"   # Veröffentlichung zweiwöchentlich
    stale_after_hours: 504
    min_interval_seconds: 1
    options:
      history_years: 2             # Erstladung; danach nur die letzten 60 Tage (Revisionen)

  ons:
    schedule: "*-*-* 07:10:00 Europe/Vienna"
    stale_after_hours: 1080          # CPI monatlich (Veröffentlichung Mitte des Monats)
    min_interval_seconds: 2
    options:
      base_url: https://www.ons.gov.uk/generator   # CSV-Generator; die JSON-API ist seit 2024-11 offline
      history_years: 15
  statcan:
    schedule: "*-*-* 07:15:00 Europe/Vienna"
    stale_after_hours: 1080
    min_interval_seconds: 2
    options:
      base_url: https://www150.statcan.gc.ca/t1/wds/rest
      history_years: 15
  abs:
    schedule: "*-*-* 07:20:00 Europe/Vienna"
    stale_after_hours: 2400          # CPI quartalsweise
    min_interval_seconds: 2
    options:
      base_url: https://data.api.abs.gov.au/rest
      history_years: 15
  imf:
    schedule: "*-*-* 07:25:00 Europe/Vienna"
    stale_after_hours: 2400          # Japan monatlich, Neuseeland quartalsweise
    min_interval_seconds: 3
    options:
      base_url: https://api.imf.org/external/sdmx/2.1
      agency: IMF.STA
      history_years: 15

# Standard für alle Quellen (je Quelle unter `retry:` überschreibbar)
retry:
  attempts: 4
  backoff_seconds: 2
  max_backoff_seconds: 60
  timeout_seconds: 30

# ---------------------------------------------------------------------------
# Volkswirtschaften und ihre Makro-Indikatoren
# category: growth | inflation | labor | rates
# transform: level | yoy (Veränderung zum Vorjahr in %) | diff (absolute Veränderung)
# higher_is: bullish | bearish – Wirkung eines höheren Werts auf die Währung
# series: FRED-Serien-ID · ECB: "Dataflow/Schlüssel" · Eurostat: "Datensatz?Filter" (ein Filter je
# Dimension, sodass genau eine Zeitreihe übrig bleibt). Alle Serien sind am 2026-11-17 live
# geprüft (Daten bis mindestens Aug./Sep. 2026). Nicht aufgeführt = keine aktuelle Gratis-Serie
# in FRED/Eurostat/ECB (siehe CLAUDE.md, Abschnitt „Offen“). Wo es keine aktuelle Reihe des
# offiziellen Leitzinses gibt, steht ein Tagesgeld-/Interbankzins als Proxy (im Label vermerkt).
# transform bei Wachstumsraten: Die Quelle liefert bereits die Veränderung zum Vorjahr in %,
# daher `level` (z. B. FRED-Serien auf *GYSAM, Eurostat RCH_A / CLV_PCH_SM).
# ---------------------------------------------------------------------------
economies:
  US:
    name: USA
    indicators:
      gdp:           {label: "BIP (real)",              source: fred, series: GDPC1,    category: growth,    transform: yoy,   higher_is: bullish, expectation: {method: mean_last, window: 3}}
      industrial:    {label: "Industrieproduktion",     source: fred, series: INDPRO,   category: growth,    transform: yoy,   higher_is: bullish, expectation: {method: mean_last, window: 3}}
      retail_sales:  {label: "Einzelhandelsumsätze",    source: fred, series: RSAFS,    category: growth,    transform: yoy,   higher_is: bullish, expectation: {method: mean_last, window: 3}}
      consumer_confidence: {label: "Verbrauchervertrauen (Uni Michigan)", source: fred, series: UMCSENT, category: growth, transform: level, higher_is: bullish, expectation: {method: mean_last, window: 3}}
      philly_fed:    {label: "Industrie-Stimmung (Fed Philadelphia, PMI-Ersatz)", short: "Philadelphia", source: fred, series: GACDFSA066MSFRBPHI, category: growth, transform: level, higher_is: bullish, expectation: {method: mean_last, window: 3}}
      empire_state:  {label: "Industrie-Stimmung (Empire State, NY Fed, PMI-Ersatz)", short: "Empire State", source: fred, series: GACDISA066MSFRBNY, category: growth, transform: level, higher_is: bullish, expectation: {method: mean_last, window: 3}}
      durable_goods: {label: "Auftragseingang Langlebige Güter", source: fred, series: DGORDER, category: growth, transform: yoy, higher_is: bullish, expectation: {method: mean_last, window: 3}}
      housing_starts: {label: "Baubeginne", source: fred, series: HOUST, category: growth, transform: yoy, higher_is: bullish, expectation: {method: mean_last, window: 3}}
      cpi:           {label: "Inflation (CPI)",         source: fred, series: CPIAUCSL, category: inflation, transform: yoy,   higher_is: bullish, expectation: {method: mean_last, window: 3}}
      core_cpi:      {label: "Kerninflation (CPI)",     source: fred, series: CPILFESL, category: inflation, transform: yoy,   higher_is: bullish, expectation: {method: mean_last, window: 3}}
      ppi:           {label: "Erzeugerpreise (PPI, Endnachfrage)", source: fred, series: PPIFIS, category: inflation, transform: yoy, higher_is: bullish, expectation: {method: mean_last, window: 3}}
      pce:           {label: "Inflation (PCE)",         source: fred, series: PCEPI,    category: inflation, transform: yoy,   higher_is: bullish, expectation: {method: mean_last, window: 3}}
      core_pce:      {label: "Kerninflation (PCE)",     source: fred, series: PCEPILFE, category: inflation, transform: yoy,   higher_is: bullish, expectation: {method: mean_last, window: 3}}
      unemployment:  {label: "Arbeitslosenquote",       source: fred, series: UNRATE,   category: labor,     transform: level, higher_is: bearish, expectation: {method: mean_last, window: 3}}
      payrolls:      {label: "Beschäftigung (NFP)",     source: fred, series: PAYEMS,   category: labor,     transform: diff,  higher_is: bullish, expectation: {method: mean_last, window: 6}}
      jobless:       {label: "Erstanträge Arbeitslosenhilfe", source: fred, series: ICSA, category: labor,   transform: level, higher_is: bearish, expectation: {method: mean_last, window: 4}}
      jolts:         {label: "Offene Stellen (JOLTS)",  source: fred, series: JTSJOL,   category: labor,     transform: level, higher_is: bullish, expectation: {method: mean_last, window: 3}}
      adp:           {label: "Beschäftigung privat (ADP)", source: fred, series: ADPMNUSNERSA, category: labor, transform: diff, higher_is: bullish, expectation: {method: mean_last, window: 6}}
      # Nur Anzeige (display_only): gehen nie in den Score ein, erscheinen aber in der Scorecard.
      gdp_qoq:       {label: "BIP-Wachstum QoQ (annualisiert)", source: fred, series: A191RL1Q225SBEA, category: growth, transform: level, higher_is: bullish, display_only: true, expectation: {method: mean_last, window: 4}}
      retail_sales_mom: {label: "Einzelhandelsumsätze MoM", source: fred, series: RSAFS, category: growth, transform: mom, higher_is: bullish, display_only: true, expectation: {method: mean_last, window: 3}}
      yield_2y_sma:  {label: "Rendite 2 Jahre (21-Tage-Mittel)", source: fred, series: DGS2, category: rates, transform: sma, window: 21, higher_is: bullish, display_only: true, expectation: {method: mean_last, window: 5}}
      services_philly: {label: "Dienstleistungen (Fed Philadelphia, Nonmanufacturing)", short: "Philadelphia", source: fred, series: GARBNDIF066MSFRBPHI, category: growth, transform: level, higher_is: bullish, display_only: true, expectation: {method: mean_last, window: 3}}
      services_empire: {label: "Dienstleistungen (NY Fed Business Leaders Survey)", short: "NY Fed", source: fred, series: BACDINA066MNFRBNY, category: growth, transform: level, higher_is: bullish, display_only: true, expectation: {method: mean_last, window: 3}}
      services_texas: {label: "Dienstleistungen (Fed Dallas, Texas Service Sector)", short: "Dallas (Texas)", source: fred, series: TSSOSBACTSAMFRBDAL, category: growth, transform: level, higher_is: bullish, display_only: true, expectation: {method: mean_last, window: 3}}
      policy_rate:   {label: "Leitzins (Fed Funds)",    source: fred, series: FEDFUNDS, category: rates,     transform: level, higher_is: bullish}
      yield_2y:      {label: "Rendite 2 Jahre",         source: fred, series: DGS2,     category: rates,     transform: level, higher_is: bullish}
      yield_10y:     {label: "Rendite 10 Jahre",        source: fred, series: DGS10,    category: rates,     transform: level, higher_is: bullish}
      real_yield_10y: {label: "Realrendite 10 Jahre (TIPS)", source: fred, series: DFII10, category: rates, transform: level, higher_is: bullish}
      dollar_index:  {label: "Dollar-Index (breit, nominal)", source: fred, series: DTWEXBGS, category: rates, transform: level, higher_is: bullish}
  EZ:
    name: Euroraum
    indicators:
      gdp:           {label: "BIP (real, Vorjahr in %)", source: eurostat, series: "namq_10_gdp?s_adj=SCA&unit=CLV_PCH_SM&na_item=B1GQ&geo=EA21", category: growth, transform: level, higher_is: bullish, expectation: {method: mean_last, window: 3}}
