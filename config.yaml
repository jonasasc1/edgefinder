      industrial:    {label: "Industrieproduktion (Vorjahr in %)", source: fred, series: JPNPRINTO01GYSAM, category: growth, transform: level, higher_is: bullish}
      retail_sales:  {label: "Einzelhandelsumsätze (Volumen, Vorjahr in %)", source: fred, series: JPNSLRTTO01GYSAM, category: growth, transform: level, higher_is: bullish}
      unemployment:  {label: "Arbeitslosenquote", source: fred, series: LRUNTTTTJPM156S, category: labor, transform: level, higher_is: bearish}
      policy_rate:   {label: "Leitzins-Proxy (Tagesgeldsatz)", source: fred, series: IRSTCI01JPM156N, category: rates, transform: level, higher_is: bullish}
      yield_10y:     {label: "Rendite 10 Jahre (Monatswert)", source: fred, series: IRLTLT01JPM156N, category: rates, transform: level, higher_is: bullish}
  CH:
    name: Schweiz
    indicators:
      gdp:           {label: "BIP (real, Vorjahr in %)", source: eurostat, series: "namq_10_gdp?s_adj=SCA&unit=CLV_PCH_SM&na_item=B1GQ&geo=CH", category: growth, transform: level, higher_is: bullish}
      retail_sales:  {label: "Einzelhandelsumsätze (Volumen, Vorjahr in %)", source: fred, series: CHESLRTTO01GYSAM, category: growth, transform: level, higher_is: bullish}
      cpi:           {label: "Inflation (HICP, Vorjahr in %)", source: eurostat, series: "prc_hicp_minr?coicop18=TOTAL&unit=RCH_A&geo=CH", category: inflation, transform: level, higher_is: bullish}
      core_cpi:      {label: "Kerninflation (HICP, Vorjahr in %)", source: eurostat, series: "prc_hicp_minr?coicop18=TOT_X_NRG_FOOD&unit=RCH_A&geo=CH", category: inflation, transform: level, higher_is: bullish}
      unemployment:  {label: "Arbeitslosenquote", source: eurostat, series: "une_rt_m?s_adj=SA&age=TOTAL&unit=PC_ACT&sex=T&geo=CH", category: labor, transform: level, higher_is: bearish}
      policy_rate:   {label: "Leitzins-Proxy (Tagesgeldsatz)", source: fred, series: IRSTCI01CHM156N, category: rates, transform: level, higher_is: bullish}
      yield_10y:     {label: "Rendite 10 Jahre (Monatswert)", source: fred, series: IRLTLT01CHM156N, category: rates, transform: level, higher_is: bullish}
  AU:
    name: Australien
    indicators:
      gdp:           {label: "BIP (real)", source: fred, series: NGDPRSAXDCAUQ, category: growth, transform: yoy, higher_is: bullish}
      unemployment:  {label: "Arbeitslosenquote", source: fred, series: LRHUTTTTAUM156S, category: labor, transform: level, higher_is: bearish}
